<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Boxing round timer that calls out punch combos over your music.">
  <title>Combo Caller</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body data-phase="idle">
  <div id="banner" class="banner" role="alert" hidden></div>

  <main>
    <!-- Timer -->
    <section class="view" data-view="timer">
      <div class="phase" id="phase">Ready</div>
      <div class="clock" id="clock">3:00</div>
      <div class="round-info" id="round-info"></div>

      <div class="drill-chips" id="drill-chips" role="radiogroup" aria-label="Drill"></div>

      <div class="combo">
        <div class="combo-numbers" id="combo-numbers">&nbsp;</div>
        <div class="combo-names" id="combo-names">&nbsp;</div>
      </div>

      <div class="source-info" id="source-info"></div>

      <div class="controls">
        <button id="btn-reset" class="btn btn-huge btn-icon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L7 6l5 4.5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
          <span>Reset</span>
        </button>
        <button id="btn-start" class="btn btn-primary btn-huge btn-icon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path id="btn-start-icon" d="M8 5v14l11-7z"/></svg>
          <span id="btn-start-label">Start</span>
        </button>
      </div>
    </section>

    <!-- Combos -->
    <section class="view" data-view="combos" hidden>
      <h2>Drill lists</h2>
      <label class="field">
        <span>Drill</span>
        <select id="drill-select"></select>
      </label>
      <label class="field">
        <span>Name</span>
        <input id="drill-name" type="text" placeholder="e.g. Jab-cross day" autocomplete="off">
      </label>

      <h3>Build a combo</h3>
      <div class="builder-display" id="builder-display"></div>
      <div class="keypad" id="keypad"></div>
      <button id="kp-body" class="btn btn-block key-body" aria-pressed="false">Body <span class="key-name">next punch to the body</span></button>
      <div class="keypad keypad-moves" id="keypad-moves"></div>
      <div class="row">
        <button id="kp-back" class="btn">Undo</button>
        <button id="kp-add" class="btn btn-primary">Add combo</button>
      </div>
      <div class="row">
        <input id="combo-text" type="text" placeholder="or type: 1-3b-SL-2" autocomplete="off">
        <button id="combo-text-add" class="btn">Add</button>
      </div>
      <p class="msg" id="combo-msg" aria-live="polite"></p>

      <h3>Combos in this drill</h3>
      <ul id="drill-combos" class="combo-list"></ul>
      <div class="row">
        <button id="drill-save" class="btn btn-primary">Save drill</button>
        <button id="drill-use" class="btn">Use for callouts</button>
      </div>
      <button id="drill-delete" class="btn btn-danger btn-block">Delete drill</button>
    </section>

    <!-- Settings -->
    <section class="view settings" data-view="settings" hidden>
      <p class="msg" id="settings-note" hidden>Changes apply after you Reset.</p>

      <h2 class="group-title">Rounds</h2>
      <div class="group">
        <div class="row-item" data-stepper="roundSec"></div>
        <div class="row-item" data-stepper="restSec"></div>
        <div class="row-item" data-stepper="rounds"></div>
        <div class="row-item" data-stepper="getReadySec"></div>
        <label class="row-item">
          <span class="row-label">10-second warning</span>
          <input type="checkbox" class="switch" id="set-warning">
        </label>
      </div>

      <h2 class="group-title">Callouts</h2>
      <div class="group">
        <div class="row-item" data-stepper="intervalSec"></div>
        <div class="row-item">
          <span class="row-label">Call out as</span>
          <span class="seg">
            <label><input type="radio" name="style" value="names"><span>Names</span></label>
            <label><input type="radio" name="style" value="numbers"><span>1-2-3</span></label>
          </span>
        </div>
        <div class="row-item">
          <span class="row-label">Order</span>
          <span class="seg">
            <label><input type="radio" name="order" value="random"><span>Random</span></label>
            <label><input type="radio" name="order" value="inorder"><span>In order</span></label>
          </span>
        </div>
        <label class="row-item">
          <span class="row-label">Longer wait after longer combos</span>
          <input type="checkbox" class="switch" id="set-scale">
        </label>
        <label class="row-item">
          <span class="row-label">Same combo all round</span>
          <input type="checkbox" class="switch" id="set-repeat">
        </label>
      </div>

      <h2 class="group-title">Coach &amp; voice</h2>
      <div class="group">
        <label class="row-item">
          <span class="row-label">Voice</span>
          <select class="row-select" id="set-voice"></select>
        </label>
        <label class="row-item">
          <span class="row-label">Coach<small id="coach-blurb"></small></span>
          <select class="row-select" id="set-personality"></select>
        </label>
        <label class="row-item col">
          <span class="row-head"><span class="row-label">Speed<small id="speed-note"></small></span><output id="out-rate"></output></span>
          <input type="range" id="set-rate" min="0.5" max="2" step="0.1">
        </label>
        <label class="row-item col">
          <span class="row-head"><span class="row-label">Volume</span><output id="out-volume"></output></span>
          <input type="range" id="set-volume" min="0" max="1" step="0.05">
        </label>
        <button class="row-item row-action" id="btn-test-voice">Test voice</button>
      </div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="timer" aria-selected="true">Timer</button>
    <button class="tab" role="tab" data-tab="combos" aria-selected="false">Combos</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
</body>
</html>
